name: Build Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        run: npm install --prefix dentalDB-backend

      - name: Install frontend dependencies
        run: npm install --prefix dentaldb

      - name: Install electron dependencies
        run: npm install --prefix electron

      - name: Build backend
        run: npm run electron:build:backend

      - name: Build frontend
        shell: bash
        run: |
          cd dentaldb
          NODE_OPTIONS="--max-old-space-size=4096" npx cross-env NEXT_PUBLIC_API_URL=http://127.0.0.1:4000 NODE_ENV=production npx next build
          cp -r .next/static .next/standalone/.next/static
          mkdir -p public
          cp -r public .next/standalone/public

      - name: Stage backend
        shell: bash
        run: |
          rm -rf electron/.staging/backend
          mkdir -p electron/.staging/backend
          cp -r dentalDB-backend/dist dentalDB-backend/package.json dentalDB-backend/package-lock.json electron/.staging/backend/
          npm install --prefix electron/.staging/backend --omit=dev

      - name: Rebuild native modules for Electron
        run: npm run electron:rebuild-native

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: cd electron && npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (Mac)
        if: matrix.platform == 'mac'
        run: cd electron && npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: cd electron && npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist-electron/*.AppImage
          retention-days: 30

      - name: Upload artifacts (Mac)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: dist-electron/*.dmg
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: dist-electron/*.exe
          retention-days: 30
