name: Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            electron_arch: x64
          - os: macos-latest
            platform: mac
            # GitHub's macos-latest runners are Apple Silicon; this matches the
            # native module to the host arch used to stage/bundle the backend.
            # The mac build target still produces x64+arm64 dmgs via electron-builder,
            # but the *staged* native binary here is arm64-only. If you need the
            # x64 dmg to also work on Intel Macs, that needs a second staging pass
            # with electron_arch: x64 — not something the previous workflow did
            # correctly either, so this isn't a regression, just a known gap.
            electron_arch: arm64
          - os: windows-latest
            platform: win
            electron_arch: x64
    runs-on: ${{ matrix.os }}
    env:
      # Force prebuilt binaries; never silently fall back to compiling from source.
      npm_config_build_from_source: "false"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache native module / electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
            ~/.electron-gyp
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install root dependencies
        run: npm install
        timeout-minutes: 10

      - name: Install backend dependencies
        run: npm install
        working-directory: dentalDB-backend
        timeout-minutes: 10

      - name: Install frontend dependencies
        run: npm install
        working-directory: dentaldb
        timeout-minutes: 10

      - name: Install electron dependencies
        run: npm install
        working-directory: electron
        timeout-minutes: 10

      - name: Resolve Electron version
        id: electron_version
        shell: bash
        # Read straight from electron/package.json so this never drifts out of
        # sync with the actual Electron version being packaged.
        run: |
          ver=$(node -p "require('./electron/package.json').devDependencies.electron.replace(/^[^0-9]*/, '')")
          echo "Electron version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build backend
        run: npm run electron:build:backend

      - name: Build frontend
        shell: bash
        run: |
          cd dentaldb
          NODE_OPTIONS="--max-old-space-size=4096" npx cross-env NEXT_PUBLIC_API_URL=http://127.0.0.1:4000 NODE_ENV=production npx next build
          cp -r .next/static .next/standalone/.next/static
          mkdir -p public
          cp -r public .next/standalone/public

      - name: Stage backend
        shell: bash
        # better-sqlite3's own install script is `prebuild-install || node-gyp rebuild`.
        # WiseLibs publishes prebuilt binaries per Electron major version
        # (e.g. better-sqlite3-v11.10.0-electron-v31-win32-x64.tar.gz), so setting
        # npm_config_runtime/target here makes prebuild-install fetch the *correct*
        # Electron-ABI binary directly during this install — no compilation, no
        # separate @electron/rebuild step, no node-gyp/Visual Studio/Docker needed.
        # (This replaces the old two-step "install then rebuild for Electron" flow,
        # which was forcing a from-source compile and hitting VS2026-detection
        # issues on Windows and a too-old Python in the Linux Docker fallback.)
        run: |
          rm -rf electron/.staging/backend
          mkdir -p electron/.staging/backend
          cp -r dentalDB-backend/dist dentalDB-backend/package.json dentalDB-backend/package-lock.json electron/.staging/backend/
          (cd electron/.staging/backend && npm install --omit=dev)
        timeout-minutes: 15
        env:
          npm_config_runtime: electron
          npm_config_target: ${{ steps.electron_version.outputs.version }}
          npm_config_arch: ${{ matrix.electron_arch }}
          npm_config_target_arch: ${{ matrix.electron_arch }}

      - name: Verify better-sqlite3 native binary is present
        shell: bash
        # Fails fast with a clear message instead of a mysterious runtime crash
        # later if prebuild-install ever can't find a matching Electron prebuild
        # (e.g. a brand-new Electron major version WiseLibs hasn't published for yet).
        run: |
          binding="electron/.staging/backend/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if [ ! -f "$binding" ]; then
            echo "::error::better-sqlite3 native binary not found at $binding — prebuild-install likely failed to find an Electron ${{ steps.electron_version.outputs.version }} (${{ matrix.electron_arch }}) prebuild."
            exit 1
          fi
          echo "Found native binary: $binding"

      - name: Bundle backend
        shell: bash
        # Collapses the ~26,600-file staged node_modules tree into a single
        # esbuild bundle (+ ~950 files that genuinely can't be bundled — see
        # electron/bundle-backend.js for why). This is what actually fixes
        # the Windows packaging timeout below; staging alone doesn't.
        run: npm run electron:bundle-backend
        timeout-minutes: 10

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        working-directory: electron
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (Mac)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        working-directory: electron
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Disable Windows Defender real-time scanning
        if: matrix.platform == 'win'
        shell: powershell
        # Build-runner only — never do this on a machine that isn't disposable CI.
        # Defender scanning every file electron-builder/NSIS touches (full backend
        # node_modules + Next.js standalone output) is what was blowing the
        # step timeout; this is a known electron-builder x windows-latest issue,
        # not a hang in the build itself.
        #
        # Belt-and-suspenders: Set-MpPreference can silently no-op if Tamper
        # Protection is active on this runner image (this has been observed to
        # vary between windows-latest image rollouts) — a terminating error
        # would fail loud, but a silent no-op just brings back the exact same
        # multi-hour hang with zero indication why. So: try the full disable,
        # then verify it actually took with Get-MpComputerStatus, and layer on
        # path/process exclusions regardless — those still help even when the
        # runner refuses to fully disable real-time protection.
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "makensis.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction SilentlyContinue

          $status = Get-MpComputerStatus
          Write-Host "RealTimeProtectionEnabled: $($status.RealTimeProtectionEnabled)"
          Write-Host "IsTamperProtected: $($status.IsTamperProtected)"
          if ($status.RealTimeProtectionEnabled) {
            Write-Warning "Real-time protection is still ON (likely Tamper Protection on this runner image) - relying on path/process exclusions only. If Package (Windows) still times out, that's the next thing to escalate to GitHub support or work around by moving to a self-hosted runner."
          }

      - name: Package (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        working-directory: electron
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The last two runs both went silent right after "building target=nsis"
          # and hung to the 40-minute timeout with zero further output, even after
          # the Defender exclusions in the previous step made no difference. That
          # rules out (or at least deprioritizes) Defender as the cause and means
          # we're currently flying blind on where time is actually going: file
          # copy, hashing, or the makensis.exe compression call itself. DEBUG
          # turns on electron-builder's internal step-by-step logging so the next
          # failure (if any) tells us exactly which phase is slow/stuck instead
          # of forcing another 40-minute guess-and-check cycle.
          DEBUG: "electron-builder"

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist-electron/*.AppImage
          retention-days: 30

      - name: Upload artifacts (Mac)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: dist-electron/*.dmg
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: dist-electron/*.exe
          retention-days: 30